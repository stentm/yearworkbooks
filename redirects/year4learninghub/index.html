<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="3;url=https://yearworkbooks.co.uk">
<link rel="canonical" href="https://yearworkbooks.co.uk">
<title>We've moved! — Year 4 Learning Hub</title>
<style>
  :root{
    --teal:#0d9488; --teal-dark:#0f766e; --blue:#2563eb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:"Trebuchet MS","Segoe UI",sans-serif;
    background:linear-gradient(135deg,var(--teal),var(--blue));
    padding:20px;
  }
  .card{
    background:white; border-radius:24px; padding:40px 32px; max-width:440px; width:100%;
    text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .card p.emoji{ font-size:3em; margin:0 0 10px; }
  h1{ color:var(--teal-dark); margin:0 0 12px; font-size:1.5em; }
  p{ color:#334155; line-height:1.6; margin:0 0 20px; }
  a.btn{
    display:inline-block; background:linear-gradient(135deg,var(--teal),var(--blue)); color:white;
    text-decoration:none; font-weight:bold; padding:14px 28px; border-radius:999px;
    box-shadow:0 6px 16px rgba(37,99,235,.3); transition:.15s;
  }
  a.btn:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(37,99,235,.4); }
  .new-url{ font-weight:bold; color:var(--teal-dark); word-break:break-all; }
  .hint{ margin-top:22px; font-size:.85em; color:#94a3b8; }
</style>
<script>
  setTimeout(function(){ window.location.href = "https://yearworkbooks.co.uk"; }, 3000);
</script>
</head>
<body>
  <div class="card">
    <p class="emoji">🚀</p>
    <h1>We've moved!</h1>
    <p>The Year 4 Learning Hub now lives at a new address:<br><span class="new-url">yearworkbooks.co.uk</span></p>
    <a class="btn" href="https://yearworkbooks.co.uk">Take me there now →</a>
    <p class="hint">Redirecting automatically in a few seconds. Please update your bookmark!</p>
  </div>
</body>
</html>
